   climbs:sessClimbs(s.id).map(c=>({routeId:c.routeId,attempts:c.attempts,result:c.result,highPoint:c.highPoint,projectId:c.projectId,saveProject:!!c.projectId,note:c.notes||'',photos:[...(c.photos||[])],temp:c.temp!=null&&c.temp!==''?c.temp:(s.conditions?.temp??''),weather:c.weather||s.conditions?.weather||''}))};go('logSession')},
 placePick:el=>{scan.place=el.dataset.v;const i=$('#sc-place');if(i)i.value=el.dataset.v;renderPlaceSugg()},
 areaPick:el=>{draft.areaName=el.dataset.v;const i=$('#d-area');if(i)i.value=el.dataset.v;renderAreaSugg()},
 deleteSession:el=>{if(el.dataset.confirm!=='1'){el.dataset.confirm='1';el.textContent='Tap again to delete. Projects and stats will update.';return}deleteSession(el.dataset.id);draft=null;tab('profile');toast('Session deleted')},
 cancelDraft:()=>{draft=null;back()},
 addClimb:()=>climbSheet(-1),editClimb:el=>climbSheet(+el.dataset.i),
 togglePartner:el=>{const id=el.dataset.id;draft.partners=draft.partners.includes(id)?draft.partners.filter(x=>x!==id):[...draft.partners,id];rerender()},
 draftVis:el=>{draft.visibility=el.dataset.v;rerender()},
 addDraftPhotos:async()=>{const fs=await pickFiles('file-multi');for(const f of fs){try{draft.photos.push(storePhoto(await downscale(f)))}catch(e){toast('One file couldn\'t be read as an image')}}rerender()},
 rmDraftPhoto:el=>{draft.photos=draft.photos.filter(x=>x!==el.dataset.id);rerender()},
 saveDraft:()=>{const wasEdit=!!draft.id;const {sid,completed}=commitDraft();draft=null;stack.pop();if(wasEdit&&cur().name==='session')stack.pop();if(completed.length){go('recap',{k:'project:'+completed[0].id});toast(RT(completed[0].routeId).name+' moved to Completed')}else{go('session',{id:sid});toast(wasEdit?'Session updated':'Session saved')}},
 shareSession:el=>{const s=S.sessions.find(x=>x.id===el.dataset.id);shareSheet(`${s.title} · ${AR(s.climbingAreaId).name}, ${fmtD(s.date)}. ${sessStats(s).sends} sends on CRUX.`)},
 viewPhoto:el=>openSheet(`<div style="padding-top:8px"><img src="${el.dataset.src}" alt="" style="width:100%;border-radius:18px"></div>`),
 editJournal:el=>journalSheet(el.dataset.id||null,el.dataset.session||''),
 // climbs & projects
 openClimb:el=>go('climb',{id:el.dataset.id}),
 openRoute:el=>go('climb',{id:el.dataset.id}),
 openBeta:el=>go('climb',{id:el.dataset.id}),
 openProject:el=>go('climb',{id:routeOfProject(el.dataset.id)}),
 projTab:el=>{projTab=el.dataset.v;rerender()},
 addProjSheet:()=>addProjSheet(),
 addWishlist:el=>{const p=addProject(el.dataset.id,'wishlist');const st=cState(el.dataset.id);if(st.seq&&st.seq!=='ai'&&!p.preferredBetaId)p.preferredBetaId=st.seq;save();rerender();toast(p.status==='wishlist'?'Added to your wishlist':'Already in your projects')},
 ascentHistory:()=>ascentSheet(),
 editGoal:el=>textSheet('Goal for next session',S.projects.find(p=>p.id===el.dataset.id),'nextSessionGoal','e.g. Link move 4 into the lip'),
 editProjNotes:el=>textSheet('Notes',S.projects.find(p=>p.id===el.dataset.id),'personalNotes','Conditions, gear, reminders',true),
 rmProject:el=>{if(el.dataset.confirm!=='1'){el.dataset.confirm='1';el.textContent='Tap again to remove. Your sessions stay.';return}const id=el.dataset.id;S.projects=S.projects.filter(p=>p.id!==id);S.climbs.forEach(c=>{if(c.projectId===id)c.projectId=null});save();rerender();toast('Removed from projects')},
 openRecap:el=>go('recap',{k:'project:'+el.dataset.id}),
 openRecapK:el=>go('recap',{k:el.dataset.k}),
 shareRecap:el=>{const k=el.dataset.k;if(k.startsWith('project:')){const pid=k.slice(8);if(!S.activities.some(a=>a.linkedProjectId===pid&&a.activityType==='project_complete')){S.activities.push({id:'act_done_'+pid,userId:'me',activityType:'project_complete',linkedSessionId:null,linkedProjectId:pid,createdAt:new Date().toISOString().slice(0,16),visibility:'public'});save()}}toast('Shared to your feed')},
 shareRoute:el=>{const r=RT(el.dataset.id);shareSheet(`${r.name} · ${showGrade(r.grade,r.discipline)} · ${AR(r.climbingAreaId).name}`)},
 cSeq:el=>{const st=cState(cur().params.id);st.seq=el.dataset.id;st.step=-1;st.overlay=true;rerender()},
 cNear:()=>{const st=cState(cur().params.id);st.near=!st.near;rerender()},
 cGo:el=>{const st=cState(cur().params.id);st.overlay=true;st.step=+el.dataset.v;rerender()},
 openPerms:async()=>{try{const p=await window.claude.use('permissions');if(p){await p.manage();scan.ai=null;rerender()}}catch(e){toast('Open the Permissions menu at the top of the artifact')}},
 aiRetry:()=>{scan.ai=null;rerender()},
 cStep:el=>{const st=cState(cur().params.id);const seq=curSeq();if(!seq)return;st.overlay=true;st.step=clamp(st.step+(+el.dataset.v),-1,seq.moves.length-1);rerender()},
 // scan
 closeScan:()=>tab('home'),
 capture:async()=>{const [f]=await pickFiles('file-cam');if(f)useFile(f)},
 uploadPhoto:async()=>{const [f]=await pickFiles('file-img');if(f)useFile(f)},
 useSample:el=>{const r=RT(el.dataset.id);scan.photo=IMGP(el.dataset.img);scan.sampleImg=el.dataset.img;scan.sampleRoute=r.id;scan.near=r.climbingAreaId;scan.blob=null;rerender()},
 retake:()=>{scan.photo=null;scan.sampleRoute=null;scan.blob=null;rerender()},
 identify:()=>runRecognition(),
 manualSearch:()=>{recog={state:'done',result:{status:'none',source:'manual search',candidates:[]}};go('results')},
 nearPicker:()=>openSheet(sheetHead('Search near')+`<div class="stack">${AREAS.map(a=>`<button class="listrow" data-act="setNear" data-v="${a.id}">${I('pin')}<span class="grow">${a.name}</span>${scan.near===a.id?I('check'):''}</button>`).join('')}<button class="listrow" data-act="setNear" data-v="">${I('globe')}<span class="grow">Anywhere</span>${!scan.near?I('check'):''}</button></div>`),
 setNear:el=>{scan.near=el.dataset.v||null;closeSheet();rerender()},
 setPlace:el=>{scan.place=el.dataset.v;rerender()},
 confirmExternal:el=>{const x=recog.result&&recog.result.candidates[+el.dataset.i];if(!x||!x.ext)return;const id=createScannedRoute(x.ext,'ai-identified');cState(id).step=-1;go('climb',{id,scan:1},{replace:true})},
 addScanned:()=>{if(!manualQ.trim())return;const id=createScannedRoute({name:manualQ.trim(),grade:'',discipline:'boulder',area:(scan.place||'').split(',')[0].trim(),region:(scan.place||'').split(',').slice(1).join(',').trim(),country:'',about:''},'user-added');cState(id).step=-1;go('climb',{id,scan:1},{replace:true})},
 confirmMatch:el=>{const id=el.dataset.id;cState(id).step=-1;go('climb',{id,scan:1},{replace:true})},
 // progress & profile
 progPeriod:el=>{progPeriod=el.dataset.v;rerender()},progDisc:el=>{progDisc=el.dataset.v;rerender()},
 profTab:el=>{profTab=el.dataset.v;rerender()},ascFilter:el=>{ascFilter=el.dataset.v;rerender()},
 jView:el=>{jView=el.dataset.v;rerender()},jDay:el=>{jSel=el.dataset.v;rerender()},
 jMonth:el=>{const mine=S.sessions.filter(s=>s.userId==='me').sort((a,b)=>b.date.localeCompare(a.date));const base=jMonth||(mine[0]?mine[0].date.slice(0,7):todayISO.slice(0,7));let [y,m]=base.split('-').map(Number);m+=+el.dataset.v;if(m<1){m=12;y--}if(m>12){m=1;y++}jMonth=y+'-'+String(m).padStart(2,'0');rerender()}
};
async function useFile(f){try{scan.photo=await downscale(f,1200);scan.sampleRoute=null;scan.sampleImg=null;scan.ai=null;scan.nameHint='';scan.blob=dataURLToBlob(scan.photo);rerender()}catch(e){toast('That file isn\'t an image we can read')}}

function shareSheet(text,extra){openSheet(sheetHead('Share')+`<div class="stack g12"><div class="card" style="padding:14px"><p id="share-t">${esc(text)}</p></div>${extra?`<button class="btn block" id="sh-extra">${esc(extra.label)}</button>`:''}<button class="btn ghost block" id="sh-copy">Copy text</button></div>`,{onMount(sh){$('#sh-copy',sh).onclick=()=>{navigator.clipboard?.writeText(text).then(()=>toast('Copied'),()=>{const r=document.createRange();r.selectNodeContents($('#share-t',sh));getSelection().removeAllRanges();getSelection().addRange(r);toast('Text selected — copy it')})};if(extra)$('#sh-extra',sh).onclick=extra.fn}})}
function textSheet(title,obj,key,ph,multi){openSheet(sheetHead(title)+`<div class="stack g12">${multi?`<textarea class="input" id="ts-v" placeholder="${esc(ph)}">${esc(obj[key])}</textarea>`:`<input class="input" id="ts-v" value="${esc(obj[key])}" placeholder="${esc(ph)}">`}<button class="btn block" id="ts-ok">Save</button></div>`,{onMount(sh){$('#ts-ok',sh).onclick=()=>{obj[key]=$('#ts-v',sh).value.trim();save();closeSheet();rerender();toast('Saved')}}})}
function commentSheet(aid){const draw=()=>{const cm=S.comments.filter(c=>c.activityId===aid);return sheetHead('Comments')+`<div class="stack g16">${cm.map(c=>`<div class="row g12" style="align-items:flex-start">${avatar(c.userId,32)}<div class="stack g4 grow"><span class="small"><b style="font-weight:600">${esc(nameOf(c.userId))}</b> <span class="muted">${ago(c.createdAt)}</span></span><p>${esc(c.text)}</p></div>${c.userId==='me'?`<button class="iconbtn" data-del="${c.id}" aria-label="Delete comment">${I('trash','sm')}</button>`:''}</div>`).join('')||'<p class="small muted">No comments yet. Say something encouraging.</p>'}
  <form class="row g8" id="cm-f"><input class="input grow" id="cm-i" placeholder="Add a comment" autocomplete="off" maxlength="300"><button class="btn" type="submit" aria-label="Post comment">Post</button></form></div>`};
  openSheet(draw(),{onMount:function m(sh){$('#cm-f',sh).onsubmit=e=>{e.preventDefault();const v=$('#cm-i',sh).value.trim();if(!v)return;S.comments.push({id:uid('cm'),activityId:aid,userId:'me',text:v,createdAt:new Date().toISOString().slice(0,16)});save();$('.sbody',sh).innerHTML=draw();m(sh);rerenderBehind()};$$('[data-del]',sh).forEach(b=>b.onclick=()=>{S.comments=S.comments.filter(c=>c.id!==b.dataset.del);save();$('.sbody',sh).innerHTML=draw();m(sh);rerenderBehind()})}})}
function rerenderBehind(){const root=$('#sheet-root');const keep=root.innerHTML?null:null;const sc=$('#app .scroll');const top=sc?sc.scrollTop:0;const c=cur();const out=SCREENS[c.name](c.params);$('#app').innerHTML=`<div class="screen ${out.noTabs?'no-tabs':''}">${out.html}</div>`;if(out.mount)out.mount();const ns=$('#app .scroll');if(ns)ns.scrollTop=top}
/* ---------- global events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el)}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.me!==undefined){S.me[el.dataset.me]=el.value;save()}
  if(el.dataset.scan){scan[el.dataset.scan]=el.value}
  if(el.id==='d-area')renderAreaSugg();
  if(el.id==='sc-place')renderPlaceSugg();
  if(el.dataset.k&&draft&&cur().name==='logSession'){draft[el.dataset.k]=el.value;if(el.dataset.k==='startTime'||el.dataset.k==='endTime'){const o=$('#dur-out');const dd=duration({startTime:draft.startTime,endTime:draft.endTime});if(o)o.textContent=dd?'Total time '+dd:''}}});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet-root').firstChild)closeSheet()});

/* ---------- boot ---------- */
try{ensureSocial()}catch(e){console.warn(e)}
try{ensureDemoV2()}catch(e){console.warn(e)}
try{S.routes.forEach(r=>{if(['user-added','ai-identified'].includes(r.verificationStatus))r.name=titleCase(r.name)});(S.customAreas||[]).forEach(a=>{a.name=titleCase(a.name)})}catch(e){}
try{if(!S.unifiedLog){S.projects.filter(p=>p.status==='wishlist').forEach(p=>S.climbs.forEach(c=>{if(c.projectId===p.id)c.projectId=null}));S.unifiedLog=true}reconcileProjects();save()}catch(e){}
if(S.onboarded){stack=[{name:'home',params:{}}];curTab='home'}else{stack=[{name:'onboarding',params:{}}]}
render(true);
</script>

</body>
</html>
